[tool.poetry]
name = "coursework-2"
version = "0.1.0"
description = "Coursework: Aircraft monitoring system"
authors = ["Gennadiy Kokaulin <Genchik691@gmail.com>"]
readme = "README.md"

packages = [
  { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.31.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^6.1.0"
black = "^23.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term --cov-report=html"

[tool.flake8]
max-line-length = 119
extend-ignore = "E203,W503"
exclude = ".git,__pycache__,venv,.venv,build,dist"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


